<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>湊一桌麻將尊老愛幼團｜濟州島 2026.11.21–11.24</title>
<meta name="theme-color" content="#FBF6EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EC; --paper:#FFFCF5; --beige:#F1E8D6; --oat:#E4D6BA; --oat-d:#CDBB98;
  --blue:#CFDFE6; --blue-d:#9DBBC8; --blue-ink:#4F7384;
  --brown:#B79A74; --brown-d:#5A4331; --ink:#3F3126; --mute:#8A7a68;
  --clay:#C58B6E; --clay-bg:#F6E4D8; --sage:#A9B89A; --sage-bg:#E8EEDF;
  --line:#E2D6BF; --r:22px; --r-s:14px;
  --serif:'Noto Serif TC','Noto Serif JP',serif;
  /* 內文：源石黑體（若裝置/自架網站有此字體就用，否則用同源的思源黑體 Noto Sans TC） */
  --sans:'GenSekiGothic2 TW','GenSekiGothic TW','源石黑體','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  /* 手寫字：辰宇落雁體 → 粉圓（Huninn，圓黑體風）→ M PLUS Rounded 1c */
  --hand:'ChenYuluoyan-Thin','ChenYuluoyan','辰宇落雁體','Huninn','jf-openhuninn-2.0','M PLUS Rounded 1c','Noto Sans TC',sans-serif;
  --num:'Cormorant Garamond','Noto Serif TC',serif;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px -18px rgba(90,67,49,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;
  background-image:radial-gradient(rgba(183,154,116,.10) 1px,transparent 1.2px);background-size:22px 22px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;line-height:1.35;color:var(--brown-d)}
a{color:var(--blue-ink);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.hide{display:none!important}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.num{font-family:var(--num)}

/* nav */
.top{position:sticky;top:0;z-index:50;background:rgba(251,246,236,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:9px;padding-bottom:9px}
.brand{font-family:var(--serif);font-weight:700;color:var(--brown-d);white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:15px}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-style:normal;font-size:13px;border:1px solid var(--blue-d)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid transparent;background:transparent;padding:6px 13px;border-radius:99px;color:var(--brown-d);cursor:pointer;font-size:14px;white-space:nowrap}
.tab:hover{background:var(--beige)}
.tab.on{background:var(--brown-d);color:var(--cream)}
@media(max-width:640px){.brand span{display:none}}

/* buttons / chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--oat-d);background:var(--paper);color:var(--brown-d);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:13.5px;line-height:1.3;transition:.15s;text-decoration:none}
.btn:hover{background:var(--beige)}
.btn.pri{background:var(--brown-d);border-color:var(--brown-d);color:var(--cream)}
.btn.pri:hover{background:#4a3627}
.btn.blue{background:var(--blue);border-color:var(--blue-d);color:#2f5262}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn.danger{color:#9b5a43;border-color:#e2b9a6}
.btn.ghost{background:transparent}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--beige);color:var(--brown-d);border:1px solid var(--line)}
.chip.blue{background:var(--blue);border-color:var(--blue-d);color:#2f5262}
.chip.clay{background:var(--clay-bg);border-color:#e6c3ae;color:#8a533a}
.chip.sage{background:var(--sage-bg);border-color:#cbd6bd;color:#506245}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card.soft{background:var(--beige);box-shadow:none}
.sec{margin:46px 0 0}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-h h2{font-size:23px}
.sec-h .en{font-family:var(--num);font-style:italic;color:var(--brown);font-size:17px}
.sec-h .line{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--oat-d) 0 4px,transparent 4px 9px);min-width:30px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* hero */
.hero{position:relative;margin:16px 0 0;border-radius:30px;overflow:hidden;min-height:430px;background:linear-gradient(180deg,#e9f0f1 0%,#f6efe0 58%,#efe3c9 100%);border:1px solid var(--line);isolation:isolate}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-1}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,246,236,.05),rgba(63,49,38,.55));z-index:0}
.hero.photo .hero-in{color:#fffaf0}
.hero.photo h1,.hero.photo .date{color:#fffaf0}
.hero-in{position:relative;z-index:1;padding:44px 30px 34px;display:flex;flex-direction:column;justify-content:flex-end;min-height:430px}
.hero .stamp{position:absolute;right:22px;top:22px;width:74px;height:74px;border-radius:50%;border:1.5px dashed var(--brown);display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.3;color:var(--brown-d);transform:rotate(10deg);background:rgba(255,252,245,.6);z-index:2}
.hero .eyebrow{font-family:var(--num);font-style:italic;font-size:clamp(15px,4vw,20px);color:var(--brown-d);letter-spacing:.04em}
.hero h1{font-size:clamp(25px,6.4vw,54px);letter-spacing:.04em;margin:6px 0 10px;white-space:nowrap}
.hero .date{font-family:var(--num);font-size:clamp(22px,4vw,30px);letter-spacing:.12em;color:var(--brown-d)}
.hero .sub{margin-top:10px;max-width:520px;color:var(--brown-d)}
.hero.photo .sub,.hero.photo .eyebrow{color:#fff4e2}
.hero-btn{position:absolute;left:18px;top:18px;z-index:3;opacity:.9}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{background:rgba(255,252,245,.85);border:1px solid var(--oat);border-radius:99px;padding:5px 14px;font-size:13.5px;color:var(--brown-d)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media(max-width:760px){.facts{grid-template-columns:repeat(2,1fr)}}
.fact{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;text-align:center}
.fact b{display:block;font-family:var(--serif);font-size:17px;color:var(--brown-d)}
.fact span{font-size:12.5px;color:var(--mute)}

/* flights / hotels */
.flight{display:flex;flex-direction:column;gap:10px}
.fl-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fl-t{font-family:var(--num);font-size:34px;line-height:1;color:var(--brown-d)}
.fl-p{font-size:12.5px;color:var(--mute)}
.fl-mid{flex:1;text-align:center;font-size:12px;color:var(--mute);position:relative}
.fl-mid::before{content:"";position:absolute;left:0;right:0;top:9px;border-top:1px dashed var(--oat-d)}
.fl-mid span{position:relative;background:var(--paper);padding:0 8px}
.hotel{display:flex;gap:14px}
.hotel .ph{width:92px;height:92px;border-radius:16px;object-fit:cover;flex:none;border:1px solid var(--line)}
.hotel h3{font-size:17px}

/* day cards on home */
.daycard{position:relative;cursor:pointer;overflow:hidden;padding:0;transition:.2s;text-align:left}
.daycard:hover{transform:translateY(-3px)}
.daycard .art{height:92px;background-size:cover;background-position:center;border-bottom:1px solid var(--line)}
.daycard .body{padding:14px 16px 16px}
.daycard .dn{font-family:var(--num);font-size:30px;font-style:italic;color:var(--brown);line-height:1}
.daycard .dd{font-size:12.5px;color:var(--mute)}
.daycard h3{font-size:16px;margin:6px 0}
.daycard ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--brown-d)}

/* day page */
.daybar{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.dtab{flex:1 0 auto;min-width:92px;text-align:center;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:9px 10px;cursor:pointer}
.dtab b{display:block;font-family:var(--num);font-size:20px;font-style:italic;color:var(--brown)}
.dtab span{font-size:12px;color:var(--mute)}
.dtab.on{background:var(--brown-d);border-color:var(--brown-d)}
.dtab.on b,.dtab.on span{color:var(--cream)}
.dayhero{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-top:12px;background:var(--beige)}
.dayhero .art{height:150px;background-size:cover;background-position:center}
.dayhero .txt{position:relative;padding:14px 22px 20px;background:var(--paper)}
.dayhero .big{font-family:var(--num);font-style:italic;font-size:54px;line-height:1;color:var(--brown)}
.dayhero h2{font-size:24px}
.washi{position:absolute;width:86px;height:22px;background:repeating-linear-gradient(135deg,rgba(157,187,200,.65) 0 6px,rgba(207,223,230,.65) 6px 12px);opacity:.9;transform:rotate(-4deg);z-index:2}
.dayhero .washi{left:18px;top:-6px}
.flagbox{border:1px dashed #d9ae96;background:#FBEFE6;border-radius:var(--r-s);padding:12px 16px;margin-top:14px}
.flagbox h4{font-size:14.5px;color:#8a533a;margin-bottom:6px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13.5px}
.flag input{margin-top:5px;accent-color:var(--clay)}
.flag.done span{text-decoration:line-through;color:var(--mute)}
.flag small{display:block;color:var(--mute)}

.tl{position:relative;margin:22px 0 0;padding-left:0}
.tl-item{position:relative;display:grid;grid-template-columns:70px 22px 1fr;gap:0 8px}
.tl-time{text-align:right;padding-top:16px;font-family:var(--num);font-size:19px;color:var(--brown-d);line-height:1.1}
.tl-time small{display:block;font-family:var(--sans);font-size:11px;color:var(--mute)}
.tl-rail{position:relative}
.tl-rail::before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:2px dotted var(--oat-d)}
.tl-item:first-child .tl-rail::before{top:22px}
.tl-item.last .tl-rail::before{bottom:calc(100% - 22px)}
.tl-dot{position:absolute;left:3px;top:19px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--blue-d);z-index:1}
.tl-item.meal .tl-dot{border-color:var(--brown)}
.tl-item.hotel .tl-dot,.tl-item.flight .tl-dot{border-color:var(--brown-d);background:var(--brown-d)}
.tl-card{margin:6px 0 4px;padding:0;overflow:hidden}
.tl-card .in{padding:16px 18px}
.tl-card h3{font-size:18px}
.tl-card .kr{font-size:13px;color:var(--mute);margin-left:6px;font-family:var(--sans);font-weight:400}
.tl-media{display:grid;grid-template-columns:130px 1fr}
@media(max-width:560px){.tl-media{grid-template-columns:1fr}.tl-item{grid-template-columns:50px 20px 1fr}.tl-time{font-size:16px}}
.ph-slot{position:relative;min-height:112px;background:linear-gradient(135deg,var(--beige),#e8f0f2);border-right:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.ph-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-slot .ic{font-size:30px;opacity:.55}
.ph-slot .up{position:absolute;right:6px;bottom:6px;font-size:11px;padding:3px 9px;background:rgba(255,252,245,.9);border:1px solid var(--oat);border-radius:99px;cursor:pointer;z-index:2;color:var(--brown-d)}
.ph-slot .cap{position:absolute;left:6px;bottom:6px;font-size:10px;background:rgba(255,252,245,.85);padding:1px 7px;border-radius:99px;color:var(--mute);z-index:2}
@media(max-width:560px){.ph-slot{min-height:150px;border-right:0;border-bottom:1px solid var(--line)}}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin:8px 0 2px}
.kv{font-size:13px;color:var(--brown-d);margin-top:3px}
.kv b{color:var(--mute);font-weight:500;margin-right:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.drive{margin:2px 0 2px;display:grid;grid-template-columns:70px 22px 1fr;gap:0 8px;font-size:12.5px;color:var(--mute)}
.drive .rail{position:relative}
.drive .rail::before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:2px dotted var(--oat-d)}
.drive .tx{padding:6px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drive .tx span.tag{background:var(--blue);color:#2f5262;border-radius:99px;padding:1px 10px;border:1px solid var(--blue-d)}
@media(max-width:560px){.drive{grid-template-columns:50px 20px 1fr}}
.tipbox{background:var(--blue);border:1px solid var(--blue-d);border-radius:var(--r-s);padding:14px 18px;color:#2b4a58}
.tipbox h4{color:#2b4a58;font-size:15px;margin-bottom:6px}
.tipbox ul,.list{margin:0;padding-left:18px}
.tipbox li,.list li{margin:3px 0;font-size:13.8px}
.mapcard iframe{width:100%;height:320px;border:0;border-radius:14px;background:var(--beige)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips .btn.on{background:var(--blue);border-color:var(--blue-d)}
textarea.note,input.inp,select.inp{width:100%;border:1px solid var(--oat);background:#fffdf8;border-radius:12px;padding:9px 12px;outline:none}
textarea.note{min-height:90px;resize:vertical}
textarea.note:focus,input.inp:focus,select.inp:focus{border-color:var(--blue-d);box-shadow:0 0 0 3px rgba(157,187,200,.3)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px}

/* food */
.fcard{padding:0;overflow:hidden;display:flex;flex-direction:column}
.fcard .ph-slot{min-height:150px;border-right:0;border-bottom:1px solid var(--line)}
.fcard .ph-slot .kr-big{font-family:var(--serif);font-size:24px;color:var(--brown);opacity:.55;text-align:center;padding:0 10px}
.fcard .in{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column}
.fcard h3{font-size:18px}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters .btn.on{background:var(--brown-d);color:var(--cream);border-color:var(--brown-d)}
.tbc{color:#9b5a43;background:var(--clay-bg);border-radius:6px;padding:0 6px;font-size:12px}

/* budget */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--num);font-size:30px;color:var(--brown-d);line-height:1.1}
.stat .l{font-size:12.5px;color:var(--mute)}
.stat.neg .v{color:#a85a3f}
.stat.pos .v{color:#55704a}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-weight:500;color:var(--mute);font-size:12.5px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px dashed var(--line);vertical-align:middle}
.tr{text-align:right!important}
.bar{height:7px;background:var(--beige);border-radius:9px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--blue-d);border-radius:9px}
.bar.over i{background:var(--clay)}
.scroll-x{overflow-x:auto}
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
.form label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.form .c2{grid-column:span 2}.form .c3{grid-column:span 3}
@media(max-width:760px){.form{grid-template-columns:repeat(2,1fr)}.form .c2,.form .c3{grid-column:span 2}}
.seg{display:inline-flex;border:1px solid var(--oat-d);border-radius:99px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--brown-d);color:var(--cream)}
.exp{display:grid;grid-template-columns:70px 1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:center}
.exp .amt{text-align:right}
.exp .amt b{font-family:var(--num);font-size:19px;color:var(--brown-d)}
.exp .row2{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* photos */
.drop{border:1.5px dashed var(--oat-d);border-radius:var(--r);background:var(--paper);padding:22px;text-align:center}
.masonry{column-count:3;column-gap:14px;margin-top:18px}
@media(max-width:860px){.masonry{column-count:2}}
.masonry figure{margin:0 0 14px;break-inside:avoid;background:var(--paper);padding:8px 8px 10px;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 20px -14px rgba(90,67,49,.5);cursor:zoom-in;position:relative;transition:.2s}
.masonry figure:nth-child(3n+1){transform:rotate(-.6deg)}.masonry figure:nth-child(3n+2){transform:rotate(.5deg)}
.masonry figure:hover{transform:translateY(-3px) rotate(0)}
.masonry img{width:100%;border-radius:3px}
.masonry figcaption{font-size:12.5px;color:var(--mute);padding:6px 4px 0;display:flex;justify-content:space-between;gap:6px}
.lb{position:fixed;inset:0;background:rgba(40,30,22,.9);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:68vh;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb .bar2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center;align-items:center;max-width:680px;width:100%}
.lb .x{position:absolute;right:14px;top:14px}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,252,245,.85);cursor:pointer;font-size:20px}
.lb .nv.l{left:10px}.lb .nv.r{right:10px}

/* checklist */
.ck-g h3{font-size:17px;margin-bottom:8px}
.ck{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.ck input[type=checkbox]{width:19px;height:19px;accent-color:var(--brown-d);flex:none}
.ck span{flex:1;font-size:14.5px}
.ck.done span{color:var(--mute);text-decoration:line-through}
.ck .del{opacity:.5;border:0;background:none;cursor:pointer;font-size:16px}
.ck .del:hover{opacity:1}
.addrow{display:flex;gap:8px;margin-top:10px}
.prog{height:8px;background:var(--beige);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sage);transition:.3s}

/* weather */
.wcard h3{font-size:17px}
.wday{display:grid;grid-template-columns:62px 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.wday .d{font-family:var(--num);font-size:20px;color:var(--brown-d);line-height:1.1}
.wday .d small{display:block;font-family:var(--sans);font-size:11px;color:var(--mute)}
.wrow{display:flex;flex-wrap:wrap;gap:4px 12px}
.wrow span b{font-weight:500;color:var(--mute);margin-right:3px;font-size:12px}

footer{margin:60px 0 40px;text-align:center;color:var(--mute);font-size:12.5px}

.jmap .pin{cursor:pointer}.jmap .pin:hover .bob{filter:brightness(1.08)}

.jleg li{cursor:pointer;padding:3px 8px;border-radius:10px}.jleg li.on{background:var(--beige);font-weight:600}

}

};

/* ---------- 照片儲存（IndexedDB，失敗時退回記憶體） ---------- */
const DB = (() => {
  const mem = { photos: new Map(), assets: new Map() };
  let dbp = null, broken = false;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('jeju26', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('photos', { keyPath: 'id' }); d.createObjectStore('assets', { keyPath: 'key' }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const keyOf = s => s === 'photos' ? 'id' : 'key';
  async function run(store, mode, fn) {
    if (!broken) {
      try {
        const d = await open();
        return await new Promise((res, rej) => { const t = d.transaction(store, mode); const rq = fn(t.objectStore(store)); t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
      } catch (e) { broken = true; }
    }
    return undefined;
  }
  return {
    get broken() { return broken; },
    async put(store, obj) { const r = await run(store, 'readwrite', s => s.put(obj)); if (broken) mem[store].set(obj[keyOf(store)], obj); return r; },
    async get(store, k) { const r = await run(store, 'readonly', s => s.get(k)); return broken ? mem[store].get(k) : r; },
    async del(store, k) { await run(store, 'readwrite', s => s.delete(k)); if (broken) mem[store].delete(k); },
    async all(store) { const r = await run(store, 'readonly', s => s.getAll()); return broken ? [...mem[store].values()] : (r || []); },
  };
})();

function resizeImage(file, max = 1600, q = 0.82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

const toTWD = e => e.cur === 'KRW' ? e.amt / S.budget.krw : e.amt;
function budgetCalc() {
  const b = S.budget, cats = TRIP.budgetCats; const act = {}; cats.forEach(c => act[c] = 0);
  const paid = {}; b.members.forEach(m => paid[m] = 0);
  let total = 0;
  b.expenses.forEach(e => { const v = toTWD(e); act[e.cat] = (act[e.cat] || 0) + v; total += v; paid[e.payer] = (paid[e.payer] || 0) + v; });
  const budgetTotal = cats.reduce((s, c) => s + (+b.budgets[c] || 0), 0);
  return { act, paid, total, budgetTotal };
}

const WCODE = { 0: '晴', 1: '大致晴', 2: '多雲時晴', 3: '陰', 45: '霧', 48: '霧淞', 51: '毛毛雨', 53: '毛毛雨', 55: '毛毛雨', 56: '凍毛毛雨', 57: '凍毛毛雨', 61: '小雨', 63: '中雨', 65: '大雨', 66: '凍雨', 67: '凍雨', 71: '小雪', 73: '中雪', 75: '大雪', 77: '雪粒', 80: '陣雨', 81: '陣雨', 82: '強陣雨', 85: '陣雪', 86: '強陣雪', 95: '雷雨', 96: '雷雨夾冰雹', 99: '強雷雨夾冰雹' };
async function fetchWeather(p) {
  if (S.weather[p.id]) return S.weather[p.id];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,snowfall_sum,wind_speed_10m_max,wind_gusts_10m_max,sunset&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=16`;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); const j = await r.json(); S.weather[p.id] = j; return j; }
  finally { clearTimeout(to); }
}
async function vWeather(el) {
  el.innerHTML = `<div class="wrap"><section class="sec" style="margin-top:26px">${secH('天氣資訊', 'Weather')}
    <div class="card soft" style="margin-bottom:16px"><h3 style="margin-bottom:6px">🌤 11 月濟州典型氣候（歷史平均，<u>不是預報</u>）</h3>
      <ul class="list small">${TRIP.climate.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <p class="small mute" style="margin:6px 0 0">來源：${TRIP.climateSrc.map(x => `<a target="_blank" rel="noopener" href="${esc(x.u)}">${esc(x.t)}</a>`).join('、')}（各資料數字略有出入，所以給範圍）</p></div>
    <p class="mute" style="margin:-6px 0 10px">下面是即時預報（Open-Meteo，只顯示 11/21–11/24，約出發前 16 天內才有資料）。<b>官方天氣警報請看韓國氣象廳（KMA）</b>。<button class="btn sm" data-wretry style="margin-left:6px">重新載入</button></p>
    <div id="wlist" class="grid g2">${TRIP.weatherPlaces.map(p => `<div class="card wcard" id="w_${p.id}"><h3>${esc(p.name)}</h3><p class="mute small">載入中…</p></div>`).join('')}</div>
    <div class="card soft" style="margin-top:16px"><h3 style="margin-bottom:8px">🔗 可靠的天氣與警報查詢</h3><div class="grid g2">${[...TRIP.weatherLinks, ...TRIP.usefulLinks].map(l => `<a class="btn" style="justify-content:space-between;border-radius:16px" target="_blank" rel="noopener" href="${esc(l.u)}"><span><b>${esc(l.t)}</b><br><span class="small mute">${esc(l.d)}</span></span><span>↗</span></a>`).join('')}</div>
    <p class="small mute" style="margin:10px 0 0">牛島船班是否停航、山區道路是否管制，請看船公司公告與韓國氣象廳特報；本站不提供即時警報。</p></div></section></div>`;
  for (const p of TRIP.weatherPlaces) {
    const box = $('#w_' + p.id); if (!box) continue;
    try {
      const j = await fetchWeather(p); const d = j.daily; const days = ['2026-11-21', '2026-11-22', '2026-11-23', '2026-11-24'];
      const rows = days.map(day => {
        const i = d.time.indexOf(day); if (i < 0) return `<div class="wday"><div class="d">${day.slice(5).replace('-', '/')}</div><div class="mute small">預報尚未開放（約出發前 16 天內才會出現），請稍後再看。</div></div>`;
        const dt = new Date(day + 'T00:00:00'); const wd = '日一二三四五六'[dt.getDay()];
        return `<div class="wday"><div class="d">${day.slice(5).replace('-', '/')}<small>週${wd}</small></div><div><b>${WCODE[d.weather_code[i]] || '—'}</b><div class="wrow"><span><b>氣溫</b>${Math.round(d.temperature_2m_min[i])}–${Math.round(d.temperature_2m_max[i])}°C</span><span><b>降水機率</b>${d.precipitation_probability_max[i] ?? '—'}%</span><span><b>降雪量</b>${d.snowfall_sum[i] ?? 0} cm</span><span><b>風速</b>${d.wind_speed_10m_max[i]} m/s</span><span><b>陣風</b>${d.wind_gusts_10m_max[i]} m/s</span><span><b>日落</b>${(d.sunset[i] || '').slice(11, 16)}</span></div></div></div>`;
      }).join('');
      box.innerHTML = `<h3>${esc(p.name)}</h3>${rows}<div class="acts"><a class="btn sm" target="_blank" rel="noopener" href="https://search.naver.com/search.naver?query=${enc(p.nq)}">NAVER 天氣</a></div>`;
    } catch (e) {
      box.innerHTML = `<h3>${esc(p.name)}</h3><p class="small" style="color:#9b5a43">目前取不到即時預報：這個預覽環境不允許網頁連到外部氣象服務；把網站發布到 Netlify／GitHub Pages 後會自動顯示。我不會顯示假資料，現在請看上方氣候參考，或點下方連結。</p><div class="acts"><a class="btn sm" target="_blank" rel="noopener" href="https://search.naver.com/search.naver?query=${enc(p.nq)}">NAVER 天氣</a><a class="btn sm" target="_blank" rel="noopener" href="https://www.weather.go.kr/w/index.do">KMA 氣象廳</a></div>`;
    }
  }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go]'); if (t) { e.preventDefault(); return go(t.dataset.go); }
  const ms = e.target.closest('[data-mapsel]'); if (ms) { S.mapSel[S.day] = ms.dataset.mapsel; return vDay($('#view')); }
  const ff = e.target.closest('[data-ff]'); if (ff) { S.foodFilter = +ff.dataset.ff; return vFood($('#view')); }
  const pf = e.target.closest('[data-pf]'); if (pf) { S.photoFilter = pf.dataset.pf; $$('[data-pf]').forEach(b => b.classList.toggle('on', b.dataset.pf === S.photoFilter)); return drawGallery(); }
  if (e.target.closest('[data-herophoto]')) return pickFile(false, async fs => { if (!fs[0]) return; try { const b = await resizeImage(fs[0], 2000, .85); await DB.put('assets', { key: 'hero', blob: b }); S.assetUrls.hero = URL.createObjectURL(b); applyHeroPhoto(); toast('主視覺已更換'); } catch (er) { toast('這個照片格式無法處理，請改用 JPG／PNG'); } });
  const su = e.target.closest('[data-slotup]'); if (su) return pickFile(false, async fs => { if (!fs[0]) return; try { const b = await resizeImage(fs[0], 1200, .82); const key = 'slot:' + su.dataset.slotup; await DB.put('assets', { key, blob: b }); S.assetUrls[key] = URL.createObjectURL(b); hydrateSlots($('#view')); toast('照片已更新'); } catch (er) { toast('這個照片格式無法處理，請改用 JPG／PNG'); } });
  // 預算
  const cur = e.target.closest('[data-cur]'); if (cur) { S.budget.cur = cur.dataset.cur; saveBudget(); $$('#curSeg button').forEach(b => b.classList.toggle('on', b.dataset.cur === S.budget.cur)); return; }
  const ee = e.target.closest('[data-editexp]'); if (ee) return editExpModal(ee.dataset.editexp);
  const de = e.target.closest('[data-delexp]'); if (de) { if (de.dataset.sure) { S.budget.expenses = S.budget.expenses.filter(x => x.id !== de.dataset.delexp); saveBudget(); return vBudget($('#view')); } de.dataset.sure = '1'; de.textContent = '確定刪除？'; return setTimeout(() => { if (de.isConnected) { delete de.dataset.sure; de.textContent = '刪除'; } }, 3000); }
  const bk = e.target.closest('[data-backup]'); if (bk) {
    const a = bk.dataset.backup;
    if (a === 'copy') { const data = JSON.stringify({ v: 1, budget: S.budget, checklist: S.checklist, notes: S.notes, custom: S.custom, flagsDone: S.flagsDone }); const box = $('#backupBox'); box.classList.remove('hide'); box.value = data; box.select(); return copyText(data); }
    if (a === 'import') { $('#backupBox').classList.remove('hide'); $('#backupAct').classList.remove('hide'); $('#backupBox').value = ''; $('#backupBox').placeholder = '把備份文字貼在這裡'; return $('#backupBox').focus(); }
    if (a === 'doimport') { try { const d = JSON.parse($('#backupBox').value); if (!d || d.v !== 1) throw 0; S.budget = d.budget; S.checklist = d.checklist; S.notes = d.notes || {}; S.custom = d.custom || {}; S.flagsDone = d.flagsDone || {}; saveBudget(); saveCheck(); LS.set('notes', S.notes); LS.set('custom', S.custom); LS.set('flagsDone', S.flagsDone); vBudget($('#view')); return toast('匯入完成'); } catch (er) { return toast('備份文字格式不正確'); } }
    if (a === 'reset') { if (bk.dataset.sure) { S.budget = { krw: TRIP.krwPerTwd, members: [...TRIP.members], budgets: {}, expenses: [], cur: 'KRW' }; saveBudget(); return vBudget($('#view')); } bk.dataset.sure = '1'; bk.textContent = '再按一次確定清空'; return setTimeout(() => { if (bk.isConnected) { delete bk.dataset.sure; bk.textContent = '清空預算資料'; } }, 3000); }
  }
  // 相簿
  if (e.target.closest('[data-upload]')) { const day = +$('#upDay').value; return pickFile(true, async fs => { let ok = 0, fail = 0; toast('處理中…'); for (const f of fs) { try { const b = await resizeImage(f); await DB.put('photos', { id: uid(), day, blob: b, caption: '', ts: Date.now() }); ok++; } catch (er) { fail++; } } await loadPhotos(); if (S.view === 'photos') { S.photoFilter = 'all'; vPhotos($('#view')); } toast(`已加入 ${ok} 張${fail ? `，${fail} 張格式不支援` : ''}`); }); }
  const fg = e.target.closest('figure[data-ph]'); if (fg) return openLB(fg.dataset.ph);
  const lb = e.target.closest('[data-lb]');
  if (lb) {
    const a = lb.dataset.lb;
    if (a === 'close') return $('#lb').remove();
    if (a === 'prev') return lbMove(-1); if (a === 'next') return lbMove(1);
    if (a === 'del') { const p = lbList[lbIdx]; if (lb.dataset.sure) { await DB.del('photos', p.id); S.photos = S.photos.filter(x => x.id !== p.id); lbList.splice(lbIdx, 1); if (lbIdx >= lbList.length) lbIdx = 0; drawGallery(); return drawLB(); } lb.dataset.sure = '1'; lb.textContent = '確定刪除？'; return; }
  }
  if (e.target.id === 'lb') e.target.remove();
  // 清單
  if (e.target.closest('[data-ckreset]')) { S.checklist.forEach(g => g.items.forEach(i => i.done = false)); saveCheck(); return vCheck($('#view')); }
  if (e.target.closest('[data-wretry]')) { S.weather = {}; return vWeather($('#view')); }

  const kgd = e.target.closest('[data-ckgdel]'); if (kgd) { const G = S.checklist.find(x => x.id === kgd.dataset.ckgdel); if (kgd.dataset.sure) { S.checklist = S.checklist.filter(x => x !== G); saveCheck(); return vCheck($('#view')); } kgd.dataset.sure = '1'; kgd.textContent = '確定刪整組？'; return setTimeout(() => { if (kgd.isConnected) { delete kgd.dataset.sure; kgd.textContent = '🗑'; } }, 3000); }
  const kd = e.target.closest('[data-ckdel]'); if (kd) { const [g, i] = kd.dataset.ckdel.split('|'); const G = S.checklist.find(x => x.id === g); G.items = G.items.filter(x => x.id !== i); saveCheck(); return vCheck($('#view')); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.flag) { S.flagsDone[t.dataset.flag] = t.checked; LS.set('flagsDone', S.flagsDone); return route(true); }
  if (t.dataset.cktext) { const [g, i] = t.dataset.cktext.split('|'); const it = S.checklist.find(x => x.id === g).items.find(x => x.id === i); const v = t.value.trim(); if (v) { it.text = v; saveCheck(); } else { t.value = it.text; toast('項目不能是空的（要刪除請按 ✕）'); } return; }
  if (t.dataset.ckgname) { const G = S.checklist.find(x => x.id === t.dataset.ckgname); const v = t.value.trim(); if (v) { G.name = v; saveCheck(); } else t.value = G.name; return; }
  if (t.dataset.ck) { const [g, i] = t.dataset.ck.split('|'); const it = S.checklist.find(x => x.id === g).items.find(x => x.id === i); it.done = t.checked; saveCheck(); return vCheck($('#view')); }
  if (t.id === 'rate') { const v = parseFloat(t.value); if (v > 0) { S.budget.krw = v; saveBudget(); vBudget($('#view')); } else toast('請輸入大於 0 的匯率'); return; }
  if (t.dataset.member !== undefined) { const i = +t.dataset.member, old = S.budget.members[i], nv = t.value.trim() || old; S.budget.members[i] = nv; S.budget.expenses.forEach(x => { if (x.payer === old) x.payer = nv; }); saveBudget(); return vBudget($('#view')); }
  if (t.dataset.budget) { S.budget.budgets[t.dataset.budget] = parseFloat(t.value) || 0; saveBudget(); return vBudget($('#view')); }

  if (t.dataset.custom) { const id = t.dataset.custom; S.custom[id] = S.custom[id] || {}; S.custom[id][t.dataset.f] = t.value.trim(); LS.set('custom', S.custom); return vDay($('#view')); }
});
document.addEventListener('input', async e => {

document.addEventListener('toggle', e => { if (e.target.id !== 'mapdet') return; S.mapOpen = e.target.open; const f = $('iframe', e.target); if (e.target.open && f && !f.getAttribute('src')) f.src = f.dataset.src; }, true);

});
document.addEventListener('keydown', e => {
  if (!$('#lb')) return; if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') { return; }
  if (e.key === 'Escape') $('#lb').remove(); if (e.key === 'ArrowLeft') lbMove(-1); if (e.key === 'ArrowRight') lbMove(1);
